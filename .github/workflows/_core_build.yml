name: Core Build Workflow

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      checkout-repo:
        required: true
        type: string
      repo-tag:
        required: false
        type: string
      repo-subdir:
        required: false
        type: string
      torch-version:
        required: false
        type: string
        default: "2.5.0"
      limit-python:
        required: false
        type: string
      limit-compute-platform:
        required: false
        type: string
      include-hash:
        required: false
        type: boolean
        default: false
      linux-wheels:
        required: false
        type: boolean
        default: true
      windows-wheels:
        required: false
        type: boolean
        default: true
      macos-wheels:
        required: false
        type: boolean
        default: true

jobs:
  get-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Checkout package repository
        uses: actions/checkout@v6

      - name: Set job matrix
        id: job-matrix
        env:
          REPO: ${{ inputs.repo }}
          TORCH_VERSION: ${{ inputs.torch-version }}
          LIMIT_PYTHON: ${{ inputs.limit-python }}
          LIMIT_COMPUTE_PLATFORM: ${{ inputs.limit-compute-platform }}
          LINUX_WHEELS: ${{ inputs.linux-wheels }}
          WINDOWS_WHEELS: ${{ inputs.windows-wheels }}
          MACOS_WHEELS: ${{ inputs.macos-wheels }}
        run: |
          set -eu
          echo "matrix=$(python get_jobs.py)" >> $GITHUB_OUTPUT

    outputs:
      matrix: ${{ steps.job-matrix.outputs.matrix }}

  build-wheels:
    needs: get-jobs
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-jobs.outputs.matrix) }}

    steps:
      - name: Free up space
        if: ${{ runner.os == 'Linux' }}
        run: |
          echo "Disk space before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/heroku
          sudo rm -rf /usr/local/share/chromium

          sudo apt purge -y \
            firefox \
            google-chrome-stable \
            microsoft-edge-stable
          sudo apt-get clean

          echo "Disk space after cleanup:"
          df -h

      - name: Enable longpaths in git
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.longpaths true

      - name: Checkout package repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.checkout-repo }}
          ref: ${{ inputs.repo-tag }}
          submodules: true

      - name: Set version suffix in setup.py
        if: ${{ inputs.repo != 'opencv-python' && inputs.repo != 'opencv/opencv-python' }}
        run: |
          set -eu

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install gnu-sed
            PATH="/opt/homebrew/opt/gnu-sed/libexec/gnubin:/usr/local/opt/gnu-sed/libexec/gnubin:$PATH"
          fi

          HASH=""
          if [[ "${{ inputs.include-hash }}" == "true" ]]; then
            HASH=$(git rev-parse --short HEAD)
          fi

          SETUP_PY_DIR="."
          if [[ -n "${{ inputs.repo-subdir }}" ]]; then
            SETUP_PY_DIR="${{ inputs.repo-subdir }}"
          fi

          VERSION_SUFFIX=+${HASH}pt${{ matrix.torch-version }}${{ matrix.compute-platform }}
          if [[ -f "$SETUP_PY_DIR/pyproject.toml" ]]; then
            sed -i "s/version = \"\([^\"]*\)\"/version = \"\1${VERSION_SUFFIX}\"/w /tmp/changes.txt" $SETUP_PY_DIR/pyproject.toml
          fi
          if [ ! -s "/tmp/changes.txt" ]; then
            sed -i "s/\(\(    \|\t\)version=\)\(.*\)\(\,$\)/\1\3 + \"$VERSION_SUFFIX\"\4/w /tmp/changes.txt" $SETUP_PY_DIR/setup.py
          fi
          if [ ! -s "/tmp/changes.txt" ]; then
            sed -i "s/\(\(    \|\t\)name=.*\,$\)/\1\n    version=\"0.0.1\" + \"$VERSION_SUFFIX\",/w /tmp/changes.txt" $SETUP_PY_DIR/setup.py
          fi
          if [ ! -s "/tmp/changes.txt" ]; then
            exit 1
          fi
        shell: bash

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: _builder

      - name: Install CUDA
        if: ${{ matrix.compute-platform != 'cpu' && inputs.repo != 'opencv-python' && inputs.repo != 'opencv/opencv-python' }}
        env:
          CUDA_VERSION: ${{ matrix.compute-platform }}
        run: |
          source _builder/.github/workflows/cuda/${{ runner.os }}_install.sh
        shell: bash

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyTorch ${{ matrix.torch-version }}+${{ matrix.compute-platform }}
        if: ${{ inputs.repo != 'opencv-python' && inputs.repo != 'opencv/opencv-python' }}
        run: |
          versionlte() {
            [ "$1" = "`echo -e "$1\n$2" | sort -V | head -n1`" ]
          }
          versionlt() {
            [ "$1" = "$2" ] && return 1 || versionlte $1 $2
          }

          SETUPTOOLS_VERSION_LIMIT=""
          if versionlt ${{ matrix.torch-version }} "2.8.0" ; then
            SETUPTOOLS_VERSION_LIMIT="<75.9"
          fi
          NUMPY_VERSION_LIMIT=""
          if versionlt ${{ matrix.torch-version }} "2.4.0" ; then
            NUMPY_VERSION_LIMIT="<2"
          fi

          pip install --upgrade \
            wheel \
            setuptools$SETUPTOOLS_VERSION_LIMIT \
            build \
            --extra-index-url https://download.pytorch.org/whl/${{ matrix.compute-platform }} \
            torch==${{ matrix.torch-version }} \
            ninja \
            numpy$NUMPY_VERSION_LIMIT
        shell: bash

      - name: Apply package specific steps
        env:
          OS: ${{ runner.os }}
          REPO: ${{ inputs.repo }}
          TORCH_VERSION: ${{ matrix.torch-version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
          COMPUTE_PLATFORM: ${{ matrix.compute-platform }}
          CUDA_VERSION: ${{ matrix.compute-platform }}
        run: bash _builder/package_specific.sh
        shell: bash

      - name: Build wheel
        env:
          OS: ${{ runner.os }}
          CUDA_VERSION: ${{ matrix.compute-platform }}
          TORCH_VERSION: ${{ matrix.torch-version }}
        run: |
          if [[ "${{ matrix.compute-platform }}" != "cpu" ]]; then
            source _builder/.github/workflows/cuda/${{ runner.os }}_env.sh
          fi
          source _builder/.github/workflows/env.sh

          SETUP_PY_DIR="."
          if [[ -n "${{ inputs.repo-subdir }}" ]]; then
            SETUP_PY_DIR="${{ inputs.repo-subdir }}"
          fi

          if [[ "${{ inputs.repo }}" == "opencv-python" ]] || [[ "${{ inputs.repo }}" == "opencv/opencv-python" ]]; then
            export ENABLE_CONTRIB=1
            export ENABLE_HEADLESS=1
            export CMAKE_ARGS="-DWITH_GSTREAMER=ON -DWITH_FFMPEG=ON"
            pip wheel $SETUP_PY_DIR --verbose --no-build-isolation --no-deps --wheel-dir dist
          else
            python -m build --wheel --no-isolation --outdir dist $SETUP_PY_DIR
          fi
        shell: bash

      - name: Build Debian Package
        if: ${{ runner.os == 'Linux' && (inputs.repo == 'opencv-python' || inputs.repo == 'opencv/opencv-python') }}
        run: |
          set -eu
          WHEEL_FILE=$(ls dist/*.whl | head -n 1)
          if [ -n "$WHEEL_FILE" ]; then
            WHEEL_BASENAME=$(basename "$WHEEL_FILE")
            VERSION=$(echo "$WHEEL_BASENAME" | cut -d'-' -f2)
            BUILD_DIR=$(mktemp -d -t opencv_deb_XXXXXX)
            DEB_DIR="$BUILD_DIR/deb_package"
            mkdir -p "$DEB_DIR/DEBIAN"
            mkdir -p "$DEB_DIR/opt/opencv_custom_wheel"

            cp "$WHEEL_FILE" "$DEB_DIR/opt/opencv_custom_wheel/"

            python3 -c "
          import os

          deb_dir = '${DEB_DIR}'
          version = '${VERSION}'
          wheel_basename = '${WHEEL_BASENAME}'

          control_lines = [
              'Package: opencv-gstreamer-wheel',
              f'Version: {version}',
              'Section: python',
              'Priority: optional',
              'Architecture: amd64',
              'Depends: libgstreamer1.0-0, libgstreamer-plugins-base1.0-0, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, libavcodec-extra, libavformat-dev, libswscale-dev, libv4l-0, libtiff-dev | libtiff6 | libtiff5',
              'Maintainer: Custom Local Build',
              'Description: Custom OpenCV Python wheel with GStreamer & FFmpeg support.',
              ' This package enforces the installation of system dependencies required for',
              ' hardware accelerated GStreamer pipelines in OpenCV. It drops the compiled',
              ' .whl file into /opt/opencv_custom_wheel/ for virtual environment usage.',
          ]

          with open(f'{deb_dir}/DEBIAN/control', 'w') as f:
              f.write('\n'.join(control_lines) + '\n')

          postinst_lines = [
              '#!/bin/bash',
              'echo \"==========================================================\"',
              'echo \" OpenCV GStreamer system dependencies installed successfully!\"',
              'echo \" \"',
              'echo \" The custom wheel file has been placed here:\"',
              f'echo \" /opt/opencv_custom_wheel/{wheel_basename}\"',
              'echo \" \"',
              'echo \" To use it in your environment (e.g., MMAction_Env), run:\"',
              'echo \" 1. source /path/to/your/venv/bin/activate\"',
              f'echo \" 2. pip install /opt/opencv_custom_wheel/{wheel_basename}\"',
              'echo \"==========================================================\"',
          ]

          with open(f'{deb_dir}/DEBIAN/postinst', 'w') as f:
              f.write('\n'.join(postinst_lines) + '\n')
          "

            chmod 0755 "$DEB_DIR/DEBIAN/postinst"
            dpkg-deb --build "$DEB_DIR" dist/opencv-python-gstreamer_${VERSION}_${{ matrix.os }}_amd64.deb
            rm -rf "$BUILD_DIR"
          fi
        shell: bash

      - uses: actions/upload-artifact@v7
        name: Upload package artifacts
        with:
          name: package-${{ matrix.os }}-py${{ matrix.python-version }}-pt${{ matrix.torch-version }}-${{ matrix.compute-platform }}
          path: |
            dist/*.whl
            dist/*.deb
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  create-release:
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Free up space
        run: |
          echo "Disk space before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/heroku
          sudo rm -rf /usr/local/share/chromium

          sudo apt purge -y \
            firefox \
            google-chrome-stable \
            microsoft-edge-stable
          sudo apt-get clean

          echo "Disk space after cleanup:"
          df -h

      - name: Get artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            *.whl
            *.deb

      - name: Get release name
        id: data
        run: |
          set -eu

          wheels=(*.whl)
          if [ ${#wheels[@]} -gt 0 ] && [ -f "${wheels[0]}" ]; then
            wheel=${wheels[0]}
            release_name=${wheel%%+*}
          else
            release_name="opencv-python-gstreamer"
          fi

          if [[ "${{ inputs.include-hash }}" == "true" ]] && [[ "${release_name}" != "opencv-python-gstreamer" ]]; then
            after_plus=${wheel##*+}
            hash=${after_plus:0:7}
            release_name="${release_name}+${hash}"
          fi

          echo "release_name=${release_name}" >> $GITHUB_OUTPUT

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.data.outputs.release_name }}
          artifacts: "*.*"
          allowUpdates: true

  make-packages-index:
    needs: create-release
    permissions:
      pages: write
      id-token: write
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/make_packages_index.yml
